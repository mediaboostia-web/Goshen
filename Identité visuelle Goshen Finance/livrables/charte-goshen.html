<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bundled Page</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #faf9f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #__bundler_loading {
        position: fixed;
        bottom: 20px;
        right: 20px;
        font:
          13px/1.4 -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: #666;
        background: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        z-index: 10000;
      }
      #__bundler_thumbnail {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf9f5;
        z-index: 9999;
      }
      #__bundler_thumbnail svg {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #__bundler_placeholder {
        color: #999;
        font-size: 14px;
      }
    </style>

    <div id="__bundler_thumbnail">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
        <rect width="120" height="120" fill="#0F172A"></rect>
        <g transform="translate(60 60) scale(.52) translate(-60 -60)">
          <g fill="none" stroke="#0D9488" stroke-width="14">
            <path d="M96.4 39 A42 42 0 1 0 96.4 81"></path>
            <path d="M102 60 L66 60"></path>
          </g>
        </g>
      </svg>
    </div>
    <div id="__bundler_loading">Unpacking...</div>

    <script>
      document.addEventListener('DOMContentLoaded', async function () {
        const loading = document.getElementById('__bundler_loading');
        function setStatus(msg) {
          if (loading) loading.textContent = msg;
        }

        const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
        const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
        function toBase64(bytes) {
          let bin = '';
          for (let i = 0; i < bytes.length; i += 0x8000) {
            bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
          }
          return btoa(bin);
        }

        // Error sink persists across replaceWith since it's on window, not the DOM.
        window.addEventListener(
          'error',
          function (e) {
            // Failed resource loads (CSP-blocked links, scripts, images) fire plain
            // events at the element — warn only; real JS errors carry message/error.
            if (!e.message && !e.error && e.target && e.target !== window) {
              console.warn(
                '[bundle] resource failed to load:',
                e.target.tagName,
                String(e.target.src || e.target.href || ''),
              );
              return;
            }
            var p = document.body || document.documentElement;
            var d =
              document.getElementById('__bundler_err') ||
              p.appendChild(document.createElement('div'));
            d.id = '__bundler_err';
            d.style.cssText =
              'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
            d.textContent =
              (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
              '[bundle] ' +
              (e.message || e.type) +
              (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
          },
          true,
        );

        try {
          const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
          const templateEl = document.querySelector('script[type="__bundler/template"]');
          if (!manifestEl || !templateEl) {
            setStatus('Error: missing bundle data');
            console.error(
              '[bundler] Missing script tags — manifestEl:',
              !!manifestEl,
              'templateEl:',
              !!templateEl,
            );
            return;
          }

          const manifest = JSON.parse(manifestEl.textContent);
          let template = JSON.parse(templateEl.textContent);

          // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
          // document's manifest; frame srcs carry an about:blank#<uuid> marker
          // instead of a substitutable uuid. Every document mints the blobs for
          // its OWN frames — from local text at the root, or text obtained from
          // its DIRECT parent over the relay protocol below — so each frame
          // navigation stays same-origin with its initiator and a deduped page
          // loads at any depth on any host, including a file:// download's
          // opaque origins (where a blob minted by one document cannot be
          // navigated to by another).
          const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
          const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
          const pageSet = new Set(pageOrder);
          const pageTexts = {};

          // ── Nested-page text protocol (parent-chain relay) ──
          // Page bundles ship once, in the ROOT document's manifest. Every
          // document mints the blobs for its OWN frames, obtaining page text
          // through a strict parent-chain relay: a document only ever SENDS to
          // its direct parent (which, for every document the publisher's own
          // runtime minted, is another publisher document) and only ACCEPTS
          // text from that direct parent; requests from below are honored only
          // for the document's own child frames, and the ROOT never sends
          // upward at all. That last rule is load-bearing: the artifact host's
          // frame-ancestors allows claude.ai (and friends) to frame an
          // artifact, so window.top can be a FOREIGN document — a top-addressed
          // protocol would hand page uuids to that ancestor and accept forged
          // "page text" from it, minting attacker HTML as an artifact-origin
          // blob document. The chain never touches the ancestor: requests stop
          // at the root, replies are origin-addressed per hop (never '*' when
          // an origin exists), and both directions are origin-gated (on https
          // a foreign sender's origin can never equal this document's; in
          // opaque contexts — file:// — everything serializes as 'null', where
          // an embedded EXTERNAL frame still fails the gate by carrying its
          // own real origin, and a sandboxed child of such a frame is excluded
          // by the own-child-frames check plus uuid unguessability). Shape is
          // deny-by-default: one request form, one reply form, no error
          // replies.
          // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
          // contexts such as a sandboxed preview iframe) — location.origin is
          // computed from the URL and stays 'https://…' even when the document
          // is sandboxed, which would misgate every opaque chain.
          const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '') ? window.origin : '*';
          function trustedOrigin(e) {
            if (e.origin === window.origin) return true; // https chains; opaque==opaque
            // file:// trees: Chrome serializes the file document's origin as
            // 'file://' while the blob: documents it mints serialize as 'null',
            // so the two legitimate shapes can never string-match — accept the
            // pair in both directions. https origins never serialize as either,
            // and sender identity (own child frame / direct parent) is checked
            // separately.
            return (
              (e.origin === 'null' &&
                (window.origin === 'file://' || window.location.protocol === 'file:')) ||
              (/^file:/.test(e.origin) && window.origin === 'null')
            );
          }
          // Non-empty only in the root document (nested bundles ship an empty
          // island), so it doubles as the root marker: the root answers from
          // local text and treats a miss as authoritative — never relaying to
          // its (possibly foreign) parent.
          const isPageRoot = pageOrder.length > 0;
          const blobUrls = {};
          const resourceBlobs = {};
          const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
          const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
          const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
          function mountPage(el, frag, text) {
            const pageBlob = new Blob([text], { type: 'text/html' });
            const u = URL.createObjectURL(pageBlob);
            resourceBlobs[u] = pageBlob;
            el.src = u + frag;
          }
          function deliverPage(uuid, text) {
            const frames = pendingFrames[uuid];
            delete pendingFrames[uuid];
            if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
            const relays = pendingRelays[uuid];
            delete pendingRelays[uuid];
            if (relays) {
              for (const cw of relays) {
                try {
                  cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET);
                } catch (err) {
                  /* gone */
                }
              }
            }
          }
          function ownFrameWindows() {
            const out = [];
            for (const f of Array.from(document.querySelectorAll('iframe'))) {
              try {
                if (f.contentWindow) out.push(f.contentWindow);
              } catch (err) {
                /* detached */
              }
            }
            return out;
          }
          window.addEventListener('message', function (e) {
            const d = e.data;
            if (!d || typeof d !== 'object' || !e.source) return;
            // Origin gate first; the structural checks below (own-child-frames
            // for requests, direct-parent + solicited-uuid for replies, the
            // root's never-relay rule) are what hold in fully opaque chains
            // where origin strings can't discriminate — a sandboxed root's
            // FOREIGN wrapper still fails all three even though both serialize
            // as real-vs-'null' rather than matching.
            if (!trustedOrigin(e)) return;
            if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
              // Requests are honored only for this document's own child frames.
              if (ownFrameWindows().indexOf(e.source) < 0) return;
              const uuid = d.__bundler_need;
              const text = pageTexts[uuid];
              if (typeof text === 'string') {
                try {
                  e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET);
                } catch (err) {
                  /* gone */
                }
                return;
              }
              if (isPageRoot || window.parent === window) return; // authoritative miss
              const waiting = pendingRelays[uuid];
              if (waiting) {
                if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
                return;
              }
              // Never-answered uuids would otherwise accumulate forever under a
              // request spray; past the cap (far above any real page count) new
              // relays are dropped rather than remembered.
              if (Object.keys(pendingRelays).length >= 128) return;
              pendingRelays[uuid] = [e.source];
              window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
            } else if (
              typeof d.__bundler_page === 'string' &&
              UUID_SHAPE.test(d.__bundler_page) &&
              typeof d.__bundler_text === 'string'
            ) {
              // The shape test is load-bearing beyond tidiness: the solicited
              // check below uses the in operator, which matches prototype keys
              // ('__proto__', 'constructor') — an unshaped key would reach
              // deliverPage and throw, painting the error banner.
              // Text is accepted only from the direct parent — the document
              // that minted this one.
              if (e.source !== window.parent || window.parent === window) return;
              if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays))
                return;
              deliverPage(d.__bundler_page, d.__bundler_text);
            }
          });

          const uuids = Object.keys(manifest);
          setStatus('Unpacking ' + uuids.length + ' assets...');

          await Promise.all(
            uuids.map(async (uuid) => {
              const entry = manifest[uuid];
              try {
                const binaryStr = atob(entry.data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

                let finalBytes = bytes;
                if (entry.compressed) {
                  if (typeof DecompressionStream !== 'undefined') {
                    const ds = new DecompressionStream('gzip');
                    const writer = ds.writable.getWriter();
                    const reader = ds.readable.getReader();
                    writer.write(bytes);
                    writer.close();
                    const chunks = [];
                    let totalLen = 0;
                    while (true) {
                      const { done, value } = await reader.read();
                      if (done) break;
                      chunks.push(value);
                      totalLen += value.length;
                    }
                    finalBytes = new Uint8Array(totalLen);
                    let offset = 0;
                    for (const chunk of chunks) {
                      finalBytes.set(chunk, offset);
                      offset += chunk.length;
                    }
                  } else {
                    console.warn(
                      'DecompressionStream not available, asset ' + uuid + ' may not render',
                    );
                  }
                }

                if (pageSet.has(uuid)) {
                  pageTexts[uuid] = new TextDecoder().decode(finalBytes);
                  return;
                }
                if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
                  // Strict artifact hosts allow font-src data: but not blob:.
                  blobUrls[uuid] =
                    'data:' +
                    entry.mime +
                    ';base64,' +
                    (entry.compressed ? toBase64(finalBytes) : entry.data);
                } else {
                  const blob = new Blob([finalBytes], { type: entry.mime });
                  blobUrls[uuid] = URL.createObjectURL(blob);
                  resourceBlobs[blobUrls[uuid]] = blob;
                }
              } catch (err) {
                console.error('Failed to decode asset ' + uuid + ':', err);
                const blob = new Blob([], { type: entry.mime });
                blobUrls[uuid] = URL.createObjectURL(blob);
                resourceBlobs[blobUrls[uuid]] = blob;
              }
            }),
          );

          const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
          const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
          const resourceMap = {};
          for (const entry of extResources) {
            if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
          }

          // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
          // consumers read these Blobs directly. Survives the swap like the error sink.
          window.__resourceBlobs = resourceBlobs;

          setStatus('Rendering...');
          // Page uuids have no blob here — they ride inside about:blank#<uuid>
          // frame markers the pass below resolves after the swap.
          for (const uuid of uuids) {
            if (pageSet.has(uuid)) continue;
            template = template.split(uuid).join(blobUrls[uuid]);
          }

          // Strip integrity + crossorigin — blob URLs from a file:// document inherit
          // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
          // The manifest bytes are ours; SRI protects against CDN compromise, not this.
          template = template
            .replace(/\s+integrity="[^"]*"/gi, '')
            .replace(/\s+crossorigin="[^"]*"/gi, '');

          const resourceScript =
            '<script>window.__resources = ' +
            JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
            ';</' +
            'script>';
          // Inject after <head> so the DOCTYPE stays first; prepending the script
          // would push the parser into quirks mode. DOMParser always emits a <head>
          // (synthesizing one if the source HTML omitted it) but may carry
          // attributes through, so match the full opening tag. slice() rather than
          // replace() keeps us clear of $-pattern substitution in resourceScript.
          const headOpen = template.match(/<head[^>]*>/i);
          if (headOpen) {
            const i = headOpen.index + headOpen[0].length;
            template = template.slice(0, i) + resourceScript + template.slice(i);
          }

          // Parse the template and swap the root element. Scripts inserted via
          // DOMParser/replaceWith are inert per spec — re-create each with
          // createElement so they execute, awaiting onload for src scripts to
          // preserve ordering (React before ReactDOM before Babel before text/babel).
          const doc = new DOMParser().parseFromString(template, 'text/html');
          document.documentElement.replaceWith(doc.documentElement);

          // Resolve page-frame markers: mint this document's own blob for each
          // framed page — from local text when this is the root, otherwise by
          // asking the direct parent over the relay protocol above. An
          // unanswered request leaves the frame on about:blank, the same
          // degraded state as a refused embed.
          {
            const MARKER =
              /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
            const needed = [];
            for (const el of Array.from(document.querySelectorAll('iframe'))) {
              const m = MARKER.exec(el.getAttribute('src') || '');
              if (!m) continue;
              const text = pageTexts[m[1]];
              if (typeof text === 'string') {
                mountPage(el, m[2] || '', text);
              } else if (window.parent !== window && !isPageRoot) {
                const had = pendingFrames[m[1]];
                (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
                if (!had) needed.push(m[1]);
              }
            }
            for (const uuid of needed) {
              window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
            }
          }

          const dead = Array.from(document.scripts);
          for (const old of dead) {
            const s = document.createElement('script');
            for (const a of old.attributes) s.setAttribute(a.name, a.value);
            s.textContent = old.textContent;
            // text/babel scripts with a src: read and inline. transformScriptTags
            // does XHR against the src, but blob:null/ from a file:// origin is
            // silently dropped. Inlining makes it a plain inline babel script,
            // which transformScriptTags handles unconditionally.
            if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
              const pre = resourceBlobs[s.src.split('#')[0]];
              s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
              s.removeAttribute('src');
            }
            const p = s.src
              ? new Promise(function (r) {
                  s.onload = s.onerror = r;
                })
              : null;
            old.replaceWith(s);
            if (p) await p;
          }
          // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
          // which fired before we swapped the document. Trigger manually if present.
          if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
            window.Babel.transformScriptTags();
          }
        } catch (err) {
          setStatus('Error unpacking: ' + err.message);
          console.error('Bundle unpack error:', err);
        }
      });
    </script>

sparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var( \n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:10mm\">\n    <svg sc-camel-view-box=\"0 0 120 120\" width=\"150\" height=\"150\" aria-label=\"Symbole Goshen\"><g fill=\"none\" stroke=\"#0D9488\" stroke-width=\"12\" stroke-linecap=\"butt\"><path d=\"M96.4 39 A42 42 0 1 0 96.4 81\"><\u002Fpath><path d=\"M102 60 L66 60\"><\u002Fpath><\u002Fg><\u002Fsvg>\n    <div>\n      <h1 style=\"font-size:82pt;line-height:.88;font-weight:800;letter-spacing:-.035em;margin:0\">Goshen<\u002Fh1>\n      <p style=\"font-size:16pt;line-height:1.35;font-weight:500;margin:8mm 0 0;max-width:120mm;color:#F8FAFC\">La fertilité des finances qui ne tarissent pas.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:6mm;border-top:2px solid #F4F4F0;padding-top:6mm\">\n    <div><div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;color:#C5A059;font-weight:700\">Marque<\u002Fdiv><div style=\"font-size:10pt;margin-top:2mm\">Gestion financière des églises — Gabon, zone CEMAC<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;color:#C5A059;font-weight:700\">Direction<\u002Fdiv><div style=\"font-size:10pt;margin-top:2mm\">Sacred Trust &amp; Clear Flow<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;color:#C5A059;font-weight:700\">Document<\u002Fdiv><div style=\"font-size:10pt;margin-top:2mm\">Référence normative — 12 pages<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<section class=\"page\" data-screen-label=\"Sommaire\" style=\"background:#F4F4F0;color:#0F172A;font-family:Archivo,sans-serif;padding:18mm;display:flex;flex-direction:column;box-sizing:border-box\">\n  <div style=\"display:flex;justify-content:space-between;border-bottom:2px solid #0F172A;padding-bottom:4mm\">\n    <span style=\"font-size:8.5pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase\">Goshen — Charte graphique<\u002Fspan>\n    <span style=\"font-size:8.5pt;font-weight:500;letter-spacing:.18em;text-transform:uppercase\">02<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-size:30pt;font-weight:800;letter-spacing:-.03em;margin:7mm 0 3mm;line-height:1\">Sommaire<\u002Fh2>\n  <p style=\"font-size:10.5pt;line-height:1.5;max-width:140mm;margin:0 0 5mm\">Quatre piliers : ce que la marque est, ce avec quoi elle se dessine, ce qu'elle s'interdit, et ce qu'elle produit. Le document fait autorité sur tout support Goshen et prévaut sur tout fichier antérieur.<\u002Fp>\n  <div style=\"display:flex;flex-direction:column\">\n    <div style=\"border-top:2px solid #0F172A;padding:2.4mm 0 1.2mm;display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-size:13pt;font-weight:800;letter-spacing:-.02em\">I — Fondations stratégiques<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;color:#0D9488\">03<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 16mm;padding:1mm 0;border-top:1px solid #C9C9C0;align-items:baseline\"><span style=\"font-size:11pt\">Plateforme de marque<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;text-align:right\">04<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 16mm;padding:1mm 0;border-top:1px solid #C9C9C0;align-items:baseline\"><span style=\"font-size:11pt\">Positionnement et architecture<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;text-align:right\">05<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 16mm;padding:1mm 0;border-top:1px solid #C9C9C0;align-items:baseline\"><span style=\"font-size:11pt\">Le nom et son récit<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;text-align:right\">06<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 16mm;padding:1mm 0;border-top:1px solid #C9C9C0;align-items:baseline\"><span style=\"font-size:11pt\">Ton de voix<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;text-align:right\">07<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:2px solid #0F172A;padding:2.4mm 0 1.2mm;margin-top:2mm;display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-size:13pt;font-weight:800;letter-spacing:-.02em\">II — Éléments visuels<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;color:#0D9488\">08<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 16mm;padding:1mm 0;border-top:1px solid #C9C9C0;align-items:baseline\"><span style=\"font-size:11pt\">Le logo — construction et grille<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;text-align:right\">09<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 16mm;padding:1mm 0;border-top:1px solid #C9C9C0;align-items:baseline\"><span style=\"font-size:11pt\">Déclinaisons et réserve<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;text-align:right\">10<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 16mm;padding:1mm 0;border-top:1px solid #C9C9C0;align-items:baseline\"><span style=\"font-size:11pt\">Palette institutionnelle<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;text-align:right\">11<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 16mm;padding:1mm 0;border-top:1px solid #C9C9C0;align-items:baseline\"><span style=\"font-size:11pt\">Gammes tonales et impression<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;text-align:right\">12<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 16mm;padding:1mm 0;border-top:1px solid #C9C9C0;align-items:baseline\"><span style=\"font-size:11pt\">Typographie et hiérarchie<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;text-align:right\">13<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 16mm;padding:1mm 0;border-top:1px solid #C9C9C0;align-items:baseline\"><span style=\"font-size:11pt\">Système graphique<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;text-align:right\">14<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 16mm;padding:1mm 0;border-top:1px solid #C9C9C0;align-items:baseline\"><span style=\"font-size:11pt\">Iconographie<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;text-align:right\">15<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:2px solid #0F172A;padding:2.4mm 0 1.2mm;margin-top:2mm;display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-size:13pt;font-weight:800;letter-spacing:-.02em\">III — Règles d'usage<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;color:#0D9488\">16<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 16mm;padding:1mm 0;border-top:1px solid #C9C9C0;align-items:baseline\"><span style=\"font-size:11pt\">Interdits, ton et accessibilité<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;text-align:right\">17<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:2px solid #0F172A;padding:2.4mm 0 1.2mm;margin-top:2mm;display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-size:13pt;font-weight:800;letter-spacing:-.02em\">IV — Déclinaisons<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;color:#0D9488\">18<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 16mm;padding:1mm 0;border-top:1px solid #C9C9C0;align-items:baseline\"><span style=\"font-size:11pt\">Le rapport officiel<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;text-align:right\">19<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 16mm;padding:1mm 0;border-top:1px solid #C9C9C0;align-items:baseline\"><span style=\"font-size:11pt\">Carte et signature<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;text-align:right\">20<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 16mm;padding:1mm 0;border-top:1px solid #C9C9C0;align-items:baseline\"><span style=\"font-size:11pt\">L'interface<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;text-align:right\">21<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 16mm;padding:1mm 0;border-top:1px solid #C9C9C0;align-items:baseline\"><span style=\"font-size:11pt\">Visuels WhatsApp<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;text-align:right\">22<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 16mm;padding:1mm 0;border-top:1px solid #C9C9C0;align-items:baseline\"><span style=\"font-size:11pt\">Enveloppes de collecte<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;text-align:right\">23<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 16mm;padding:1mm 0;border-top:1px solid #C9C9C0;border-bottom:1px solid #C9C9C0;align-items:baseline\"><span style=\"font-size:11pt\">Les huit constantes<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:9pt;text-align:right\">24<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"Pilier I\" style=\"background:#0F172A;color:#F4F4F0;font-family:Archivo,sans-serif;padding:18mm;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box\">\n  <div style=\"display:flex;justify-content:space-between;border-bottom:2px solid #F4F4F0;padding-bottom:4mm\">\n    <span style=\"font-size:8.5pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase\">Goshen — Charte graphique<\u002Fspan>\n    <span style=\"font-size:8.5pt;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#C5A059\">Pilier I<\u002Fspan>\n  <\u002Fdiv>\n  <div>\n    <div style=\"font-family:'Space Mono',monospace;font-size:90pt;font-weight:700;line-height:1;color:#0D9488\">I<\u002Fdiv>\n    <h2 style=\"font-size:46pt;font-weight:800;letter-spacing:-.035em;line-height:1;margin:6mm 0 0\">Fondations stratégiques<\u002Fh2>\n    <p style=\"font-size:13pt;line-height:1.45;max-width:130mm;margin:8mm 0 0;color:#F8FAFC\">Ce que Goshen est avant d'être un écran : mission, positionnement, nom, voix.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"border-top:2px solid #F4F4F0;padding-top:5mm\"><svg sc-camel-view-box=\"0 0 240 40\" width=\"100%\" height=\"28\"><g stroke=\"#4A5670\" stroke-width=\"1\" fill=\"none\"><path d=\"M0 20H240M40 0V40M100 0V40M160 0V40M220 0V40\"><\u002Fpath><\u002Fg><g fill=\"#0D9488\"><rect x=\"36\" y=\"16\" width=\"8\" height=\"8\"><\u002Frect><rect x=\"96\" y=\"16\" width=\"8\" height=\"8\"><\u002Frect><rect x=\"156\" y=\"16\" width=\"8\" height=\"8\"><\u002Frect><\u002Fg><g fill=\"#C5A059\"><rect x=\"216\" y=\"16\" width=\"8\" height=\"8\"><\u002Frect><\u002Fg><\u002Fsvg><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"Plateforme de marque\" style=\"background:#F8FAFC;color:#0F172A;font-family:Archivo,sans-serif;padding:18mm;display:flex;flex-direction:column;box-sizing:border-box\">\n  <div style=\"display:flex;justify-content:space-between;border-bottom:2px solid #0F172A;padding-bottom:4mm\">\n    <span style=\"font-size:8.5pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase\">Pilier I — Fondations<\u002Fspan>\n    <span style=\"font-size:8.5pt;font-weight:500;letter-spacing:.18em;text-transform:uppercase\">04<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-size:30pt;font-weight:800;letter-spacing:-.03em;margin:9mm 0 4mm;line-height:1.02\">Plateforme de marque<\u002Fh2>\n  <p style=\"font-size:10.5pt;line-height:1.55;max-width:135mm;margin:0 0 7mm\">Tout ce que Goshen produit — un écran, un rapport, une phrase de support — découle des quatre énoncés de cette page. Ils ne sont pas des slogans : ce sont les critères d'arbitrage quand une décision de conception hésite.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:5mm\">\n    <div style=\"border:1px solid #D6D6CB;background:#F4F4F0;padding:6mm\">\n      <div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#0D9488\">Mission<\u002Fdiv>\n      <p style=\"font-size:12pt;line-height:1.4;font-weight:600;margin:3mm 0 0\">Éradiquer l'erreur et le doute dans la comptabilité des églises d'Afrique centrale.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #D6D6CB;background:#F4F4F0;padding:6mm\">\n      <div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#0D9488\">Vision<\u002Fdiv>\n      <p style=\"font-size:12pt;line-height:1.4;font-weight:600;margin:3mm 0 0\">Des communautés financièrement indépendantes parce qu'elles sont financièrement lisibles.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border:1px solid #D6D6CB;background:#0F172A;color:#F4F4F0;padding:6mm;margin-top:5mm\">\n    <div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#C5A059\">Promesse<\u002Fdiv>\n    <p style=\"font-size:15pt;line-height:1.3;font-weight:700;letter-spacing:-.01em;margin:3mm 0 0;max-width:150mm\">Chaque franc entré est tracé, chaque franc sorti est justifié, et le dimanche suivant tout le monde le sait.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"border-top:2px solid #0F172A;margin-top:7mm;padding-top:5mm\">\n    <div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:4mm\">Quatre valeurs, quatre conséquences de conception<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4mm\">\n      <div style=\"border-top:2px solid #0D9488;padding-top:3mm\"><div style=\"font-size:12pt;font-weight:700\">Intégrité<\u002Fdiv><p style=\"font-size:9pt;line-height:1.45;margin:2mm 0 0\">Aucune donnée ne s'efface : elle se corrige, avec auteur et motif visibles.<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:2px solid #0D9488;padding-top:3mm\"><div style=\"font-size:12pt;font-weight:700\">Clarté<\u002Fdiv><p style=\"font-size:9pt;line-height:1.45;margin:2mm 0 0\">Un chiffre par ligne, une action par écran, aucun jargon comptable non traduit.<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:2px solid #0D9488;padding-top:3mm\"><div style=\"font-size:12pt;font-weight:700\">Fraternité<\u002Fdiv><p style=\"font-size:9pt;line-height:1.45;margin:2mm 0 0\">L'outil sert la communauté avant l'administration : il ne surveille pas, il atteste.<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:2px solid #0D9488;padding-top:3mm\"><div style=\"font-size:12pt;font-weight:700\">Innovation<\u002Fdiv><p style=\"font-size:9pt;line-height:1.45;margin:2mm 0 0\">Mobile d'abord, hors-ligne toléré, Mobile Money natif. Jamais la nouveauté pour elle-même.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"Positionnement\" style=\"background:#F4F4F0;color:#0F172A;font-family:Archivo,sans-serif;padding:18mm;display:flex;flex-direction:column;box-sizing:border-box\">\n  <div style=\"display:flex;justify-content:space-between;border-bottom:2px solid #0F172A;padding-bottom:4mm\">\n    <span style=\"font-size:8.5pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase\">Pilier I — Fondations<\u002Fspan>\n    <span style=\"font-size:8.5pt;font-weight:500;letter-spacing:.18em;text-transform:uppercase\">05<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-size:30pt;font-weight:800;letter-spacing:-.03em;margin:9mm 0 4mm;line-height:1.02\">Positionnement<\u002Fh2>\n  <p style=\"font-size:10.5pt;line-height:1.55;max-width:135mm;margin:0 0 7mm\">Goshen n'est ni un logiciel comptable importé ni une caisse enregistreuse. C'est la première fintech ecclésiale calibrée pour la zone CEMAC : en FCFA, en français, nativement multi-annexes, adossée aux opérateurs Mobile Money locaux.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6mm;align-items:start\">\n    <div style=\"border:1px solid #D6D6CB;background:#F8FAFC;padding:6mm\">\n      <div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:4mm\">Territoire<\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 200 160\" width=\"100%\" height=\"118\">\n        <g stroke=\"#C9C9C0\" stroke-width=\"1\" fill=\"none\"><path d=\"M10 80H190M100 10V150\"><\u002Fpath><\u002Fg>\n        <g fill=\"#8B96AB\" font-family=\"Archivo\" font-size=\"7\">\n          <text x=\"10\" y=\"8\">Rigueur institutionnelle<\u002Ftext>\n          <text x=\"10\" y=\"158\">Informel<\u002Ftext>\n          <text x=\"12\" y=\"76\">Générique<\u002Ftext>\n          <text x=\"150\" y=\"76\">Ancré CEMAC<\u002Ftext>\n        <\u002Fg>\n        <g fill=\"#8B96AB\"><rect x=\"42\" y=\"112\" width=\"6\" height=\"6\"><\u002Frect><rect x=\"58\" y=\"46\" width=\"6\" height=\"6\"><\u002Frect><rect x=\"30\" y=\"62\" width=\"6\" height=\"6\"><\u002Frect><\u002Fg>\n        <g font-family=\"Archivo\" font-size=\"7\" fill=\"#4A5670\"><text x=\"52\" y=\"118\">Cahier papier<\u002Ftext><text x=\"68\" y=\"51\">Logiciels comptables importés<\u002Ftext><text x=\"40\" y=\"67\">Tableur partagé<\u002Ftext><\u002Fg>\n        <rect x=\"140\" y=\"36\" width=\"12\" height=\"12\" fill=\"#0D9488\"><\u002Frect>\n        <text x=\"156\" y=\"45\" font-family=\"Archivo\" font-size=\"9\" font-weight=\"700\" fill=\"#0F172A\">Goshen<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:5mm\">\n      <div><div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#0D9488\">Pour qui<\u002Fdiv><p style=\"font-size:10pt;line-height:1.5;margin:2mm 0 0\">Le trésorier et le pasteur d'une assemblée de 80 à 900 fidèles, qui supervise de deux à cinq annexes et saisit depuis son téléphone, souvent le dimanche après le culte.<\u002Fp><\u002Fdiv>\n      <div><div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#0D9488\">Contre quoi<\u002Fdiv><p style=\"font-size:10pt;line-height:1.5;margin:2mm 0 0\">Contre le cahier qui se perd, le compte rendu oral invérifiable et le tableur que personne ne sait ouvrir deux ans plus tard.<\u002Fp><\u002Fdiv>\n      <div><div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#0D9488\">Preuve<\u002Fdiv><p style=\"font-size:10pt;line-height:1.5;margin:2mm 0 0\">Le rapport officiel généré en un clic : un document que le conseil, l'auditeur régional et l'assemblée lisent sans discussion possible.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:2px solid #0F172A;margin-top:7mm;padding-top:5mm\">\n    <div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:4mm\">Architecture de marque<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4mm\">\n      <div style=\"border:1px solid #D6D6CB;background:#F8FAFC;padding:5mm\"><div style=\"font-size:11pt;font-weight:700\">Goshen<\u002Fdiv><p style=\"font-size:9pt;line-height:1.45;margin:2mm 0 0\">La marque mère. Seule à porter le symbole complet et la signature.<\u002Fp><\u002Fdiv>\n      <div style=\"border:1px solid #D6D6CB;background:#F8FAFC;padding:5mm\"><div style=\"font-size:11pt;font-weight:700\">Goshen Annexes<\u002Fdiv><p style=\"font-size:9pt;line-height:1.45;margin:2mm 0 0\">Module de supervision. Nom composé en Archivo 600, jamais de logo propre.<\u002Fp><\u002Fdiv>\n      <div style=\"border:1px solid #D6D6CB;background:#F8FAFC;padding:5mm\"><div style=\"font-size:11pt;font-weight:700\">Goshen Audit<\u002Fdiv><p style=\"font-size:9pt;line-height:1.45;margin:2mm 0 0\">Accès auditeur régional. Même règle : un nom, pas une identité parallèle.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"Nom et récit\" style=\"background:#F8FAFC;color:#0F172A;font-family:Archivo,sans-serif;padding:18mm;display:flex;flex-direction:column;box-sizing:border-box\">\n  <div style=\"display:flex;justify-content:space-between;border-bottom:2px solid #0F172A;padding-bottom:4mm\">\n    <span style=\"font-size:8.5pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase\">Pilier I — Fondations<\u002Fspan>\n    <span style=\"font-size:8.5pt;font-weight:500;letter-spacing:.18em;text-transform:uppercase\">06<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-size:30pt;font-weight:800;letter-spacing:-.03em;margin:9mm 0 4mm;line-height:1.02\">Le nom et son récit<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1.35fr 1fr;gap:7mm;align-items:start\">\n    <div>\n      <p style=\"font-size:10.5pt;line-height:1.55;margin:0 0 5mm\">Gosen désigne, dans le récit de la Genèse, la région fertile où une communauté déplacée reçoit une terre pour prospérer et garder ses troupeaux. Le nom porte donc trois idées utiles à une application financière : un territoire délimité, une ressource qui se renouvelle, une communauté qui administre elle-même son bien.<\u002Fp>\n      <p style=\"font-size:10.5pt;line-height:1.55;margin:0 0 5mm\">Le nom s'écrit Goshen, graphie francophone la plus lisible pour un public gabonais habitué aux transcriptions anglophones du Mobile Money. Il se prononce en deux syllabes, s'épelle sans hésitation au téléphone et ne se confond avec aucun opérateur existant.<\u002Fp>\n      <div style=\"border-top:2px solid #0F172A;padding-top:5mm;margin-top:2mm\">\n        <div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:3mm\">Signature<\u002Fdiv>\n        <p style=\"font-size:19pt;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:0\">La fertilité des finances qui ne tarissent pas.<\u002Fp>\n        <p style=\"font-size:9.5pt;line-height:1.5;margin:4mm 0 0\">Elle accompagne le logo sur la couverture d'un rapport, la page d'accueil et les visuels d'acquisition. Elle ne s'intègre jamais au verrouillage du logo et ne se traduit pas.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #D6D6CB;background:#F4F4F0;padding:6mm\">\n      <div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:4mm\">Champ lexical autorisé<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2.5mm\">\n        <div style=\"border-left:2px solid #0D9488;padding-left:3mm;font-size:10pt;font-weight:600\">Traçabilité<\u002Fdiv>\n        <div style=\"border-left:2px solid #0D9488;padding-left:3mm;font-size:10pt;font-weight:600\">Intendance<\u002Fdiv>\n        <div style=\"border-left:2px solid #0D9488;padding-left:3mm;font-size:10pt;font-weight:600\">Assemblée<\u002Fdiv>\n        <div style=\"border-left:2px solid #0D9488;padding-left:3mm;font-size:10pt;font-weight:600\">Récolte<\u002Fdiv>\n        <div style=\"border-left:2px solid #0D9488;padding-left:3mm;font-size:10pt;font-weight:600\">Registre<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin:6mm 0 4mm\">Champ lexical proscrit<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2.5mm\">\n        <div style=\"border-left:2px solid #C9C9C0;padding-left:3mm;font-size:10pt;color:#4A5670\">Bénédiction financière<\u002Fdiv>\n        <div style=\"border-left:2px solid #C9C9C0;padding-left:3mm;font-size:10pt;color:#4A5670\">Miracle<\u002Fdiv>\n        <div style=\"border-left:2px solid #C9C9C0;padding-left:3mm;font-size:10pt;color:#4A5670\">Investissement<\u002Fdiv>\n        <div style=\"border-left:2px solid #C9C9C0;padding-left:3mm;font-size:10pt;color:#4A5670\">Croissance exponentielle<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"Ton de voix\" style=\"background:#F4F4F0;color:#0F172A;font-family:Archivo,sans-serif;padding:18mm;display:flex;flex-direction:column;box-sizing:border-box\">\n  <div style=\"display:flex;justify-content:space-between;border-bottom:2px solid #0F172A;padding-bottom:4mm\">\n    <span style=\"font-size:8.5pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase\">Pilier I — Fondations<\u002Fspan>\n    <span style=\"font-size:8.5pt;font-weight:500;letter-spacing:.18em;text-transform:uppercase\">07<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-size:30pt;font-weight:800;letter-spacing:-.03em;margin:9mm 0 4mm;line-height:1.02\">Ton de voix<\u002Fh2>\n  <p style=\"font-size:10.5pt;line-height:1.55;max-width:135mm;margin:0 0 7mm\">Goshen s'adresse à des responsables qui engagent leur crédibilité devant leur assemblée. Le ton est celui d'un greffier compétent : précis, déférent, jamais familier, jamais alarmiste. On nomme les choses, on donne le chiffre, on indique l'action suivante.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4mm;margin-bottom:7mm\">\n    <div style=\"border-top:2px solid #0F172A;padding-top:3mm\"><div style=\"font-size:11pt;font-weight:700\">Institutionnel<\u002Fdiv><p style=\"font-size:9pt;line-height:1.45;margin:2mm 0 0\">Vouvoiement systématique, phrases complètes, aucune abréviation.<\u002Fp><\u002Fdiv>\n    <div style=\"border-top:2px solid #0F172A;padding-top:3mm\"><div style=\"font-size:11pt;font-weight:700\">Rassurant<\u002Fdiv><p style=\"font-size:9pt;line-height:1.45;margin:2mm 0 0\">On dit ce qui est enregistré et où. Jamais de point d'exclamation.<\u002Fp><\u002Fdiv>\n    <div style=\"border-top:2px solid #0F172A;padding-top:3mm\"><div style=\"font-size:11pt;font-weight:700\">Guidant<\u002Fdiv><p style=\"font-size:9pt;line-height:1.45;margin:2mm 0 0\">Chaque message se termine par l'action possible, à l'infinitif.<\u002Fp><\u002Fdiv>\n    <div style=\"border-top:2px solid #0F172A;padding-top:3mm\"><div style=\"font-size:11pt;font-weight:700\">Digne<\u002Fdiv><p style=\"font-size:9pt;line-height:1.45;margin:2mm 0 0\">Aucune plaisanterie sur l'argent, aucune familiarité avec la charge pastorale.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:10pt\">\n    <sc-raw-thead><sc-raw-tr style=\"border-bottom:2px solid #0F172A\"><sc-raw-th style=\"text-align:left;padding:3mm 0;font-size:8pt;letter-spacing:.16em;text-transform:uppercase\">Situation<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;padding:3mm 4mm;font-size:8pt;letter-spacing:.16em;text-transform:uppercase;color:#0A6F66\">On écrit<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;padding:3mm 0;font-size:8pt;letter-spacing:.16em;text-transform:uppercase;color:#4A5670\">On n'écrit pas<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"border-bottom:1px solid #C9C9C0\"><sc-raw-td style=\"padding:3.5mm 0;width:32%\">Saisie enregistrée<\u002Fsc-raw-td><sc-raw-td style=\"padding:3.5mm 4mm;font-weight:600\">Collecte du 12 janvier enregistrée. En attente du visa pasteur.<\u002Fsc-raw-td><sc-raw-td style=\"padding:3.5mm 0;color:#4A5670\">C'est dans la boîte !<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid #C9C9C0\"><sc-raw-td style=\"padding:3.5mm 0\">Erreur de champ<\u002Fsc-raw-td><sc-raw-td style=\"padding:3.5mm 4mm;font-weight:600\">Le montant est requis pour valider la ligne.<\u002Fsc-raw-td><sc-raw-td style=\"padding:3.5mm 0;color:#4A5670\">Oups, il manque un truc…<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid #C9C9C0\"><sc-raw-td style=\"padding:3.5mm 0\">Action principale<\u002Fsc-raw-td><sc-raw-td style=\"padding:3.5mm 4mm;font-weight:600\">Générer le rapport officiel<\u002Fsc-raw-td><sc-raw-td style=\"padding:3.5mm 0;color:#4A5670\">Go ! / Let's go<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid #C9C9C0\"><sc-raw-td style=\"padding:3.5mm 0\">Rappel de dépense<\u002Fsc-raw-td><sc-raw-td style=\"padding:3.5mm 4mm;font-weight:600\">Loyer de la salle : échéance dans trois jours.<\u002Fsc-raw-td><sc-raw-td style=\"padding:3.5mm 0;color:#4A5670\">Attention, vous allez être en retard !<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid #C9C9C0\"><sc-raw-td style=\"padding:3.5mm 0\">Annexe sans saisie<\u002Fsc-raw-td><sc-raw-td style=\"padding:3.5mm 4mm;font-weight:600\">Aucune collecte saisie à Owendo depuis le 5 janvier.<\u002Fsc-raw-td><sc-raw-td style=\"padding:3.5mm 0;color:#4A5670\">Owendo est en retard sur ses objectifs.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"Pilier II\" style=\"background:#0F172A;color:#F4F4F0;font-family:Archivo,sans-serif;padding:18mm;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box\">\n  <div style=\"display:flex;justify-content:space-between;border-bottom:2px solid #F4F4F0;padding-bottom:4mm\">\n    <span style=\"font-size:8.5pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase\">Goshen — Charte graphique<\u002Fspan>\n    <span style=\"font-size:8.5pt;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#C5A059\">Pilier II<\u002Fspan>\n  <\u002Fdiv>\n  <div>\n    <div style=\"font-family:'Space Mono',monospace;font-size:90pt;font-weight:700;line-height:1;color:#0D9488\">II<\u002Fdiv>\n    <h2 style=\"font-size:46pt;font-weight:800;letter-spacing:-.035em;line-height:1;margin:6mm 0 0\">Éléments visuels<\u002Fh2>\n    <p style=\"font-size:13pt;line-height:1.45;max-width:130mm;margin:8mm 0 0;color:#F8FAFC\">Le logo, la couleur, la lettre, la trame et le pictogramme — les cinq matériaux du système.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"border-top:2px solid #F4F4F0;padding-top:5mm\"><svg sc-camel-view-box=\"0 0 240 40\" width=\"100%\" height=\"28\"><g stroke=\"#4A5670\" stroke-width=\"1\" fill=\"none\"><path d=\"M0 20H240M40 0V40M100 0V40M160 0V40M220 0V40\"><\u002Fpath><\u002Fg><g fill=\"#0D9488\"><rect x=\"36\" y=\"16\" width=\"8\" height=\"8\"><\u002Frect><rect x=\"96\" y=\"16\" width=\"8\" height=\"8\"><\u002Frect><rect x=\"156\" y=\"16\" width=\"8\" height=\"8\"><\u002Frect><\u002Fg><g fill=\"#C5A059\"><rect x=\"216\" y=\"16\" width=\"8\" height=\"8\"><\u002Frect><\u002Fg><\u002Fsvg><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"03 Logo\" style=\"background:#F8FAFC;color:#0F172A;font-family:Archivo,sans-serif;padding:18mm;display:flex;flex-direction:column;box-sizing:border-box\">\n  <div style=\"display:flex;justify-content:space-between;border-bottom:2px solid #0F172A;padding-bottom:4mm\">\n    <span style=\"font-size:8.5pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase\">Pilier II — Éléments visuels<\u002Fspan>\n    <span style=\"font-size:8.5pt;font-weight:500;letter-spacing:.18em;text-transform:uppercase\">09<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-size:30pt;font-weight:800;letter-spacing:-.03em;margin:9mm 0 4mm;line-height:1.02\">Construction et grille<\u002Fh2>\n  <p style=\"font-size:10.5pt;line-height:1.55;max-width:135mm;margin:0 0 8mm\">Le symbole est un G ouvert : l'arc représente l'alliance et la communauté, l'interruption à droite représente le flux — l'argent qui entre, qui est tracé, qui ressort justifié. La barre horizontale ferme la lecture de la lettre et sert d'axe au verrouillage typographique.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8mm;align-items:start\">\n    <div style=\"border:1px solid #D6D6CB;background:#F4F4F0;padding:8mm;display:flex;justify-content:center\">\n      <svg sc-camel-view-box=\"0 0 120 120\" width=\"220\" height=\"220\"><g stroke=\"#C5A059\" stroke-width=\".75\" fill=\"none\"><path d=\"M0 0H120V120H0Z\"><\u002Fpath><path d=\"M0 18H120M0 60H120M0 102H120M18 0V120M60 0V120M102 0V120\"><\u002Fpath><circle cx=\"60\" cy=\"60\" r=\"42\"><\u002Fcircle><\u002Fg><g fill=\"none\" stroke=\"#0F172A\" stroke-width=\"12\"><path d=\"M96.4 39 A42 42 0 1 0 96.4 81\"><\u002Fpath><path d=\"M102 60 L66 60\"><\u002Fpath><\u002Fg><\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:5mm\">\n      <div><div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#0D9488\">Module<\u002Fdiv><p style=\"font-size:10pt;line-height:1.5;margin:2mm 0 0\">Le symbole s'inscrit dans un carré de 120 unités découpé en modules de 18. Le disque a un rayon de 42 unités, la graisse du trait est de 12 unités — soit un dixième du carré.<\u002Fp><\u002Fdiv>\n      <div><div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#0D9488\">Ouverture<\u002Fdiv><p style=\"font-size:10pt;line-height:1.5;margin:2mm 0 0\">L'arc est interrompu sur 60° centrés sur l'axe horizontal droit. Cette ouverture ne se referme jamais, quelle que soit la taille.<\u002Fp><\u002Fdiv>\n      <div><div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#0D9488\">Extrémités<\u002Fdiv><p style=\"font-size:10pt;line-height:1.5;margin:2mm 0 0\">Coupes franches, à 90°. Aucun arrondi, aucun raccord adouci : la rigueur du tracé porte la promesse de rigueur comptable.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:2px solid #0F172A;margin-top:9mm;padding-top:6mm\">\n    <div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:5mm\">Logo principal — verrouillage horizontal<\u002Fdiv>\n    <div style=\"border:1px solid #D6D6CB;padding:10mm;display:flex;align-items:center;gap:7mm;background:#FFFFFF\">\n      <svg sc-camel-view-box=\"0 0 120 120\" width=\"74\" height=\"74\"><g fill=\"none\" stroke=\"#0F172A\" stroke-width=\"12\"><path d=\"M96.4 39 A42 42 0 1 0 96.4 81\"><\u002Fpath><path d=\"M102 60 L66 60\"><\u002Fpath><\u002Fg><\u002Fsvg>\n      <div style=\"width:1px;align-self:stretch;background:#D6D6CB\"><\u002Fdiv>\n      <div>\n        <div style=\"font-size:38pt;font-weight:800;letter-spacing:-.035em;line-height:.9\">Goshen<\u002Fdiv>\n        <div style=\"font-size:9pt;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#0D9488;margin-top:3mm\">Gestion financière ecclésiale<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<section class=\"page\" data-screen-label=\"04 Variantes\" style=\"background:#F4F4F0;color:#0F172A;font-family:Archivo,sans-serif;padding:18mm;display:flex;flex-direction:column;box-sizing:border-box\">\n  <div style=\"display:flex;justify-content:space-between;border-bottom:2px solid #0F172A;padding-bottom:4mm\">\n    <span style=\"font-size:8.5pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase\">Pilier II — Éléments visuels<\u002Fspan>\n    <span style=\"font-size:8.5pt;font-weight:500;letter-spacing:.18em;text-transform:uppercase\">10<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-size:30pt;font-weight:800;letter-spacing:-.03em;margin:9mm 0 6mm;line-height:1.02\">Déclinaisons et réserve<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:5mm\">\n    <div style=\"border:1px solid #D6D6CB;background:#F8FAFC;padding:6mm;display:flex;flex-direction:column;gap:5mm;justify-content:space-between\">\n      <div style=\"display:flex;align-items:center;gap:3mm\"><svg sc-camel-view-box=\"0 0 120 120\" width=\"30\" height=\"30\"><g fill=\"none\" stroke=\"#0F172A\" stroke-width=\"12\"><path d=\"M96.4 39 A42 42 0 1 0 96.4 81\"><\u002Fpath><path d=\"M102 60 L66 60\"><\u002Fpath><\u002Fg><\u002Fsvg><span style=\"font-size:17pt;font-weig ht:1;margin:4mm 0 2mm\">Aa<\u002Fdiv>\n      <div style=\"font-family:'Space Mono',monospace;font-size:11pt;line-height:1.6\">ABCDEFGHIJKLM<br>abcdefghijklm<br>0123456789 FCFA<\u002Fdiv>\n      <p style=\"font-size:9pt;line-height:1.45;margin:4mm 0 0\">Réservée aux montants, références d'écriture, dates et identifiants. Chasse fixe : les colonnes de chiffres s'alignent sans effort de lecture.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:2px solid #0F172A;margin-top:7mm;padding-top:5mm\">\n    <div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:4mm\">Échelle<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column\">\n      <div style=\"display:grid;grid-template-columns:1fr 52mm;gap:5mm;align-items:baseline;padding:3mm 0;border-top:1px solid #C9C9C0\"><div style=\"font-size:26pt;font-weight:800;letter-spacing:-.03em\">Collecte du dimanche<\u002Fdiv><div style=\"font-family:'Space Mono',monospace;font-size:8.5pt\">H1 · 32/34 · 800 · -3%<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 52mm;gap:5mm;align-items:baseline;padding:3mm 0;border-top:1px solid #C9C9C0\"><div style=\"font-size:17pt;font-weight:700;letter-spacing:-.02em\">Annexe d'Owendo<\u002Fdiv><div style=\"font-family:'Space Mono',monospace;font-size:8.5pt\">H2 · 22/26 · 700 · -2%<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 52mm;gap:5mm;align-items:baseline;padding:3mm 0;border-top:1px solid #C9C9C0\"><div style=\"font-size:8.5pt;font-weight:700;letter-spacing:.16em;text-transform:uppercase\">Dîmes · Offrandes · Dépenses<\u002Fdiv><div style=\"font-family:'Space Mono',monospace;font-size:8.5pt\">Label · 12 · 700 · +16%<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 52mm;gap:5mm;align-items:baseline;padding:3mm 0;border-top:1px solid #C9C9C0\"><div style=\"font-size:10.5pt;line-height:1.55\">Le trésorier saisit les entrées du jour et le pasteur valide. Chaque écriture porte son auteur, son horodatage et sa pièce justificative.<\u002Fdiv><div style=\"font-family:'Space Mono',monospace;font-size:8.5pt\">Corps · 16/26 · 400<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 52mm;gap:5mm;align-items:baseline;padding:3mm 0;border-top:1px solid #C9C9C0;border-bottom:1px solid #C9C9C0\"><div style=\"font-family:'Space Mono',monospace;font-size:19pt;font-weight:700\">1 482 500 FCFA<\u002Fdiv><div style=\"font-family:'Space Mono',monospace;font-size:8.5pt\">Montant · 24 · 700 · tabulaire<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:9.5pt;line-height:1.5;margin:5mm 0 0;max-width:150mm\">Les montants s'écrivent avec une espace fine insécable comme séparateur de milliers, jamais de virgule anglo-saxonne, et le sigle FCFA toujours postposé, séparé d'une espace.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<section class=\"page\" data-screen-label=\"08 Système graphique\" style=\"background:#F4F4F0;color:#0F172A;font-family:Archivo,sans-serif;padding:18mm;display:flex;flex-direction:column;box-sizing:border-box\">\n  <div style=\"display:flex;justify-content:space-between;border-bottom:2px solid #0F172A;padding-bottom:4mm\">\n    <span style=\"font-size:8.5pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase\">Pilier II — Éléments visuels<\u002Fspan>\n    <span style=\"font-size:8.5pt;font-weight:500;letter-spacing:.18em;text-transform:uppercase\">14<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-size:30pt;font-weight:800;letter-spacing:-.03em;margin:9mm 0 4mm;line-height:1.02\">La trame du réseau<\u002Fh2>\n  <p style=\"font-size:10.5pt;line-height:1.55;max-width:135mm;margin:0 0 7mm\">Un seul motif structure tous les supports : l'église mère et ses annexes, reliées par des filets fins. Il se décline en frise d'en-tête, en fond de couverture et en séparateur de section. Il ne se déforme pas, ne tourne pas, ne se colorise pas.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:5mm\">\n    <div style=\"border:1px solid #D6D6CB;background:#F8FAFC;padding:6mm\">\n      <svg sc-camel-view-box=\"0 0 240 90\" width=\"100%\" height=\"70\"><g stroke=\"#0F172A\" stroke-width=\"1\" fill=\"none\"><path d=\"M30 45H90M90 45H150M150 45H210M90 45L150 15M90 45L150 75\"><\u002Fpath><\u002Fg><g fill=\"#0F172A\"><rect x=\"24\" y=\"39\" width=\"12\" height=\"12\"><\u002Frect><\u002Fg><g fill=\"#0D9488\"><rect x=\"85\" y=\"40\" width=\"10\" height=\"10\"><\u002Frect><rect x=\"145\" y=\"10\" width=\"10\" height=\"10\"><\u002Frect><rect x=\"145\" y=\"70\" width=\"10\" height=\"10\"><\u002Frect><rect x=\"205\" y=\"40\" width=\"10\" height=\"10\"><\u002Frect><\u002Fg><\u002Fsvg>\n      <div style=\"font-size:8pt;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-top:4mm\">Motif source<\u002Fdiv>\n      <p style=\"font-size:9pt;line-height:1.45;margin:2mm 0 0\">Nœud carré, filet de 1 px, angles à 26,5° uniquement. Le carré plein bleu nuit désigne l'église mère.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #D6D6CB;background:#0F172A;padding:6mm;color:#F4F4F0\">\n      <svg sc-camel-view-box=\"0 0 240 90\" width=\"100%\" height=\"70\"><g stroke=\"#4A5670\" stroke-width=\"1\" fill=\"none\"><path d=\"M0 22H240M0 45H240M0 68H240M40 0V90M100 0V90M160 0V90M220 0V90\"><\u002Fpath><\u002Fg><g fill=\"#0D9488\"><rect x=\"36\" y=\"41\" width=\"8\" height=\"8\"><\u002Frect><rect x=\"96\" y=\"18\" width=\"8\" height=\"8\"><\u002Frect><rect x=\"156\" y=\"64\" width=\"8\" height=\"8\"><\u002Frect><\u002Fg><g fill=\"#C5A059\"><rect x=\"216\" y=\"41\" width=\"8\" height=\"8\"><\u002Frect><\u002Fg><\u002Fsvg>\n      <div style=\"font-size:8pt;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-top:4mm;color:#C5A059\">Trame de fond<\u002Fdiv>\n      <p style=\"font-size:9pt;line-height:1.45;margin:2mm 0 0\">Grille 40 × 23, filets à 20 % d'opacité maximum. Réservée aux couvertures et aux aplats nuit. Jamais derrière un tableau de chiffres.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:2px solid #0F172A;margin-top:7mm;padding-top:5mm;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6mm\">\n    <div><div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#0D9488\">Angles<\u002Fdiv><p style=\"font-size:9.5pt;line-height:1.5;margin:2mm 0 0\">Rayon de courbure zéro partout : boutons, cartes, champs, encadrés, vignettes. Aucune exception.<\u002Fp><\u002Fdiv>\n    <div><div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#0D9488\">Filets<\u002Fdiv><p style=\"font-size:9.5pt;line-height:1.5;margin:2mm 0 0\">Deux épaisseurs seulement : 2 px pour séparer deux sections, 1 px pour structurer les lignes d'un tableau.<\u002Fp><\u002Fdiv>\n    <div><div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#0D9488\">Matière<\u002Fdiv><p style=\"font-size:9.5pt;line-height:1.5;margin:2mm 0 0\">Sur l'imprimé, papier non couché teinté crème, 120 g minimum. À l'écran, aplat mat, aucune ombre portée décorative.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<section class=\"page\" data-screen-label=\"09 Iconographie\" style=\"background:#F8FAFC;color:#0F172A;font-family:Archivo,sans-serif;padding:18mm;display:flex;flex-direction:column;box-sizing:border-box\">\n  <div style=\"display:flex;justify-content:space-between;border-bottom:2px solid #0F172A;padding-bottom:4mm\">\n    <span style=\"font-size:8.5pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase\">Pilier II — Éléments visuels<\u002Fspan>\n    <span style=\"font-size:8.5pt;font-weight:500;letter-spacing:.18em;text-transform:uppercase\">15<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-size:30pt;font-weight:800;letter-spacing:-.03em;margin:9mm 0 4mm;line-height:1.02\">Un trait, une grille, aucun symbole religieux<\u002Fh2>\n  <p style=\"fo
