bottom:4mm\">\n    <span style=\"font-size:8.5pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase\">Goshen — Charte graphique<\u002Fspan>\n    <span style=\"font-size:8.5pt;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#C5A059\">Pilier III<\u002Fspan>\n  <\u002Fdiv>\n  <div>\n    <div style=\"font-family:'Space Mono',monospace;font-size:90pt;font-weight:700;line-height:1;color:#0D9488\">III<\u002Fdiv>\n    <h2 style=\"font-size:46pt;font-weight:800;letter-spacing:-.035em;line-height:1;margin:6mm 0 0\">Règles d'usage<\u002Fh2>\n    <p style=\"font-size:13pt;line-height:1.45;max-width:130mm;margin:8mm 0 0;color:#F8FAFC\">Ce que l'identité s'interdit, pour rester reconnaissable partout et par tous.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"border-top:2px solid #F4F4F0;padding-top:5mm\"><svg sc-camel-view-box=\"0 0 240 40\" width=\"100%\" height=\"28\"><g stroke=\"#4A5670\" stroke-width=\"1\" fill=\"none\"><path d=\"M0 20H240M40 0V40M100 0V40M160 0V40M220 0V40\"><\u002Fpath><\u002Fg><g fill=\"#0D9488\"><rect x=\"36\" y=\"16\" width=\"8\" height=\"8\"><\u002Frect><rect x=\"96\" y=\"16\" width=\"8\" height=\"8\"><\u002Frect><rect x=\"156\" y=\"16\" width=\"8\" height=\"8\"><\u002Frect><\u002Fg><g fill=\"#C5A059\"><rect x=\"216\" y=\"16\" width=\"8\" height=\"8\"><\u002Frect><\u002Fg><\u002Fsvg><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"10 Règles\" style=\"background:#F4F4F0;color:#0F172A;font-family:Archivo,sans-serif;padding:18mm;display:flex;flex-direction:column;box-sizing:border-box\">\n  <div style=\"display:flex;justify-content:space-between;border-bottom:2px solid #0F172A;padding-bottom:4mm\">\n    <span style=\"font-size:8.5pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase\">08 — Règles d'usage<\u002Fspan>\n    <span style=\"font-size:8.5pt;font-weight:500;letter-spacing:.18em;text-transform:uppercase\">17<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-size:30pt;font-weight:800;letter-spacing:-.03em;margin:9mm 0 6mm;line-height:1.02\">Ce qui est interdit<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:4mm\">\n    <div style=\"border:1px solid #D6D6CB;background:#F8FAFC;padding:5mm\"><div style=\"height:24mm;display:flex;align-items:center;justify-content:center;background:#E8EBF0\"><svg sc-camel-view-box=\"0 0 120 120\" width=\"54\" height=\"34\" sc-camel-preserve-aspect-ratio=\"none\"><g fill=\"none\" stroke=\"#0F172A\" stroke-width=\"12\"><path d=\"M96.4 39 A42 42 0 1 0 96.4 81\"><\u002Fpath><path d=\"M102 60 L66 60\"><\u002Fpath><\u002Fg><\u002Fsvg><\u002Fdiv><div style=\"font-size:9pt;font-weight:700;color:#0F172A;margin-top:3mm\">01 — Déformer<\u002Fdiv><p style=\"font-size:8.5pt;line-height:1.4;margin:1.5mm 0 0\">Aucune mise à l'échelle non proportionnelle, aucune rotation, aucune inclinaison.<\u002Fp><\u002Fdiv>\n    <div style=\"border:1px solid #D6D6CB;background:#F8FAFC;padding:5mm\"><div style=\"height:24mm;display:flex;align-items:center;justify-content:center;background:#C5A059\"><svg sc-camel-view-box=\"0 0 120 120\" width=\"34\" height=\"34\"><g fill=\"none\" stroke=\"#DCC694\" stroke-width=\"12\"><path d=\"M96.4 39 A42 42 0 1 0 96.4 81\"><\u002Fpath><path d=\"M102 60 L66 60\"><\u002Fpath><\u002Fg><\u002Fsvg><\u002Fdiv><div style=\"font-size:9pt;font-weight:700;margin-top:3mm\">02 — Contraste faible<\u002Fdiv><p style=\"font-size:8.5pt;line-height:1.4;margin:1.5mm 0 0\">Le logo se pose sur crème, blanc ou bleu nuit. Jamais sur l'or, jamais sur l'émeraude.<\u002Fp><\u002Fdiv>\n    <div style=\"border:1px solid #D6D6CB;background:#F8FAFC;padding:5mm\"><div style=\"height:24mm;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#7C3AED,#EC4899)\"><svg sc-camel-view-box=\"0 0 120 120\" width=\"34\" height=\"34\"><g fill=\"none\" stroke=\"#F8FAFC\" stroke-width=\"12\"><path d=\"M96.4 39 A42 42 0 1 0 96.4 81\"><\u002Fpath><path d=\"M102 60 L66 60\"><\u002Fpath><\u002Fg><\u002Fsvg><\u002Fdiv><div style=\"font-size:9pt;font-weight:700;margin-top:3mm\">03 — Dégradés<\u002Fdiv><p style=\"font-size:8.5pt;line-height:1.4;margin:1.5mm 0 0\">Aucun dégradé, aucune lueur, aucun effet métallique ou néon sur la marque.<\u002Fp><\u002Fdiv>\n    <div style=\"border:1px solid #D6D6CB;background:#F8FAFC;padding:5mm\"><div style=\"height:24mm;display:flex;align-items:center;justify-content:center;background:#0F172A\"><svg sc-camel-view-box=\"0 0 120 120\" width=\"34\" height=\"34\" style=\"filter:blur(1.4px)\"><g fill=\"none\" stroke=\"#F4F4F0\" stroke-width=\"12\"><path d=\"M96.4 39 A42 42 0 1 0 96.4 81\"><\u002Fpath><path d=\"M102 60 L66 60\"><\u002Fpath><\u002Fg><\u002Fsvg><\u002Fdiv><div style=\"font-size:9pt;font-weight:700;margin-top:3mm\">04 — Ombres et flous<\u002Fdiv><p style=\"font-size:8.5pt;line-height:1.4;margin:1.5mm 0 0\">Pas d'ombre portée, pas de relief, pas de fond translucide derrière des chiffres.<\u002Fp><\u002Fdiv>\n    <div style=\"border:1px solid #D6D6CB;background:#F8FAFC;padding:5mm\"><div style=\"height:24mm;display:flex;align-items:center;justify-content:center;background:#E8EBF0\"><div style=\"display:flex;align-items:center;gap:1mm\"><svg sc-camel-view-box=\"0 0 120 120\" width=\"30\" height=\"30\"><g fill=\"none\" stroke=\"#0F172A\" stroke-width=\"12\"><path d=\"M96.4 39 A42 42 0 1 0 96.4 81\"><\u002Fpath><path d=\"M102 60 L66 60\"><\u002Fpath><\u002Fg><\u002Fsvg><span style=\"font-size:14pt;font-weight:800;letter-spacing:-.03em\">Goshen<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"font-size:9pt;font-weight:700;margin-top:3mm\">05 — Réserve violée<\u002Fdiv><p style=\"font-size:8.5pt;line-height:1.4;margin:1.5mm 0 0\">Le mot ne colle jamais au symbole : la réserve vaut la demi-hauteur du symbole.<\u002Fp><\u002Fdiv>\n    <div style=\"border:1px solid #D6D6CB;background:#F8FAFC;padding:5mm\"><div style=\"height:24mm;display:flex;align-items:center;justify-content:center;background:#E8EBF0\"><span style=\"font-family:Georgia,serif;font-size:17pt;font-style:italic\">Goshen<\u002Fspan><\u002Fdiv><div style=\"font-size:9pt;font-weight:700;margin-top:3mm\">06 — Retyper le nom<\u002Fdiv><p style=\"font-size:8.5pt;line-height:1.4;margin:1.5mm 0 0\">Le mot-symbole est un tracé vectoriel fixe. Il ne se recompose jamais dans une autre police.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:2px solid #0F172A;margin-top:7mm;padding-top:5mm;display:grid;grid-template-columns:1fr 1fr;gap:8mm\">\n    <div>\n      <div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#0D9488;margin-bottom:3mm\">Ton de voix<\u002Fdiv>\n      <p style=\"font-size:9.5pt;line-height:1.5;margin:0\">Institutionnel, respectueux, guidant. On s'adresse au trésorier avec la déférence due à sa charge : « Valider la collecte », « Générer le rapport officiel », jamais « Go ! » ni « Oups ».<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:8pt;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#0D9488;margin-bottom:3mm\">Accessibilité<\u002Fdiv>\n      <p style=\"font-size:9.5pt;line-height:1.5;margin:0\">Corps de texte 16 px minimum sur mobile, contraste 4,5:1 sur tout montant, zone tactile 44 px. L'utilisateur type a entre 38 et 52 ans et lit en plein soleil.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<section class=\"page\" data-screen-label=\"Pilier IV\" style=\"background:#0F172A;color:#F4F4F0;font-family:Archivo,sans-serif;padding:18mm;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box\">\n  <div style=\"display:flex;justify-content:space-between;border-bottom:2px solid #F4F4F0;padding-bottom:4mm\">\n    <span style=\"font-size:8.5pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase\">Goshen — Charte graphique<\u002Fspan>\n    <span style=\"font-size:8.5pt;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#C5A059\">Pilier IV<\u002Fspan>\n  <\u002Fdiv>\n  <div>\n    <div style=\"font-family:'Space Mono',monospace;font-size:90pt;font-weight:700;line-height:1;color:#0D9488\">IV<\u002Fdiv>\n    <h2 style=\"font-size:46pt;font-weight:800;letter-spacing:-.035em;line-height:1;margin:6mm 0 0\">Déclinaisons<\u002Fh2>\n    <p style=\"font-size:13pt;line-height:1.45;max-width:130mm;margin:8mm 0 0;color:#F8FAFC\">Les supports réels : le rapport que l'assemblée lit, la carte, l'écran, l'enveloppe.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"border-top:2px solid #F4F4F0;padding-top:5mm\"><svg sc-camel-view-box=\"0 0 240 40\" width=\"100%\" height=\"28\"><g stroke=\"#4A5670\" stroke-width=\"1\" fill=\"none\"><path d=\"M0 20H240M40 0V40M100 0V40M160 0V40M220 0V40\"><\u002Fpath><\u002Fg><g fill=\"#0D9488\"><rect x=\"36\" y=\"16\" width=\"8\" height=\"8\"><\u002Frect><rect x=\"96\" y=\"16\" width=\"8\" height=\"8\"><\u002Frect><rect x=\"156\" y=\"16\" width=\"8\" height=\"8\"><\u002Frect><\u002Fg><g fill=\"#C5A059\"><rect x=\"216\" y=\"16\" width=\"8\" height=\"8\"><\u002Frect><\u002Fg><\u002Fsvg><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"Rapport officiel\" style=\"background:#F8FAFC;color:#0F172A;font-family:Archivo,sans-serif;padding:18mm;display:flex;flex-direction:column;box-sizing:border-box\">\n  <div style=\"display:flex;justify-content:space-between;border-bottom:2px solid #0F172A;padding-bottom:4mm\">\n    <span style=\"font-size:8.5pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase\">Pilier IV — Déclinaisons<\u002Fspan>\n    <span style=\"font-size:8.5pt;font-weight:500;letter-spacing:.18em;text-transform:uppercase\">19<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-size:30pt;font-weight:800;letter-spacing:-.03em;margin:9mm 0 4mm;line-height:1.02\">Le rapport officiel<\u002Fh2>\n  <p style=\"font-size:10.5pt;line-height:1.55;max-width:135mm;margin:0 0 7mm\">C'est le support le plus important de la marque : le document que l'assemblée lit et conserve. Papier en-tête A4, ma
